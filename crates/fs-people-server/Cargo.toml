[package]
name = "fs-people-server"
description = "Cap'n Proto server of FreeSynergy people: the contract people.capnp over a Unix socket, in front of any People provider"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_people_server"

[dependencies]
fs-people-core = { path = "../fs-people-core", version = "0.0.14" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "9cbce63c73045a2ea32b88038fd35732c4762624", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "2bb70d826681403894ec6d65a7fad9d3a3f51ac2", version = "0.2.0" }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
capnp = "0.27"
rustix = { version = "1", features = ["process"] }
capnp-rpc = "0.27"
serde_json = "1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["full"] }
