[package]
name = "fs-people-app"
description = "The people program of FreeSynergy, first window: list, search, read, create, edit and delete people, vCard in and out, on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fs-people-core = { path = "../fs-people-core", version = "0.0.14" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
# provisional: becomes a tag once reviewed
fs-components-app = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9ab4ac280fb2354d41fdbc15bdbed92664a016de", version = "0.1.0" }
# provisional: becomes a tag once reviewed
fs-components-workbenches = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9ab4ac280fb2354d41fdbc15bdbed92664a016de", version = "0.1.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "9cbce63c73045a2ea32b88038fd35732c4762624", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "2bb70d826681403894ec6d65a7fad9d3a3f51ac2", version = "0.2.0" }
capnp = "0.27"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
fs-people-server = { path = "../fs-people-server", version = "0.0.14" }
tempfile = "3"
# provisional: becomes a tag once reviewed
fs-components-render = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "9ab4ac280fb2354d41fdbc15bdbed92664a016de", version = "0.1.0" }
