[package]
name = "fs-people-core"
description = "Program core of FreeSynergy people: JSContact cards over fs-objects, vCard import/export, same-person proposals"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
# Maintained fork of calcard 0.3.14 (Apache-2.0 OR MIT), pinned exactly; only the adapter modules name it (see DESIGN.md).
calcard-next = "=3.0.1"
# The contract and the provider rule (ADR 0045).
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "2bb70d826681403894ec6d65a7fad9d3a3f51ac2", version = "0.2.0" }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
serde = { version = "1", features = ["derive"] }
# Without it the parser can be one step off a double, and a valid float would not come back exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
tempfile = "3"
