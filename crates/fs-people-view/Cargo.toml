[package]
name = "fs-people-view"
description = "Module 'look at / edit a card' of FreeSynergy people: card to form, form back onto the card, card to reading sheet (sorted out of fs-people-app)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fs-people-core = { path = "../fs-people-core" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# provisional (OPEN, see sortierung/people.md): the form/sheet types still live in the workbench
# provisional: becomes a tag once reviewed
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.23" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
