[package]
name = "fs-people"
description = "FreeSynergy.People: contacts and people. Without arguments the window opens; subcommands work like git; `serve` runs the server."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-people"
path = "src/main.rs"

[features]
default = ["gui"]
# The window (Blinc). Without it the binary has the commands and the server only:
# `cargo build --no-default-features`.
gui = ["dep:fs-people-app"]

[dependencies]
fs-people-cli = { path = "../fs-people-cli", version = "0.0.14" }
fs-people-server = { path = "../fs-people-server", version = "0.0.14" }
fs-people-app = { path = "../fs-people-app", version = "0.0.14", optional = true }

[dev-dependencies]
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "9cbce63c73045a2ea32b88038fd35732c4762624", version = "0.1.4" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "2bb70d826681403894ec6d65a7fad9d3a3f51ac2", version = "0.2.0" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
fs-people-core = { path = "../fs-people-core", version = "0.0.14" }
capnp = "0.27"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
