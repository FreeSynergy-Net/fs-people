# ADR 0041: keep debug output small
[profile.dev]
debug = "line-tables-only"      # enough for backtraces, a fraction of full debug info
incremental = true

[profile.dev.package."*"]
debug = false                    # no debug info for dependencies

[profile.release]
debug = false
strip = "symbols"
lto = "thin"

# The tests read the English words whatever the language of the machine (the German ones are tested through `words(&Locale)`).
[env]
LC_ALL = { value = "en_US.UTF-8", force = true }
