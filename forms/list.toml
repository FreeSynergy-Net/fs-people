# layout-nur (placeholder values, no binding, no colour/font). Model: KAddressBook screenshot (katalog-plan/bilder/people/vorbild/Kaddressbook_screenshot.png)
schema = 1
kind = "frontend"
id = "layout-nur"
extends = "net.freesynergy.People"
exec = "fs-forms-run"
title = "people-layout-title"
style = "default"
message = [
  { key = "people-layout-title", lang = "de", text = "Personen (Platzhalter)" },
  { key = "people-layout-title", lang = "en", text = "People (placeholder)" },
]

