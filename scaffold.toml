# Blueprint of fs-people (schema 2, ADR 0099 addendum 2026-11-18). Data-only package;
# the person (RFC 9553 card, type Profile) is owned by the module person (fs-modules-person, tag v0.0.3); the forms descriptions lie in forms/.
schema = 2

[program]
name = "people"
version = "0.0.15"
skeleton = "0.1.0"
capability = "people"
summary = { en = "People, roles and contacts", de = "Menschen, Rollen und Kontakte" }
description = { en = "Keep people as JSContact cards with roles, relations and groups; import and export vCard.", de = "Menschen als JSContact-Karten mit Rollen, Beziehungen und Gruppen führen; vCard importieren und exportieren." }
categories = ["Office", "ContactManagement"]

[contract]
version = "0.1"
id = "0xf41de01e6495cb24"
provides = [{ contract = "people.persons", version = "0.1" }]

# Art 1: the module person (fs-modules-person) owns the type Profile (JSContact card, RFC 9553). The RPM requires fs-module-person >= 0.0.3.
[[module]]
name = "person"
kind = "standard"
version = "0.0.3"

[[type]]
name = "Profile"
module = "person"

# Main frontend: P-F1 (list). The schema allows ONE [frontend] block (fs-blueprint model.rs `frontend: Frontend`); the other three descriptions are in
# forms/ and NOT yet named here: forms/P-F2-einzel.toml (people-detail), forms/P-F3-karten.toml (people-cards), forms/P-F4-kontakte.toml (people-contacts).
[frontend]
standard = "list"
layout = "forms/P-F1-liste.toml"
covers = "all"
